[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
# Holdback's contracts, which the tests deploy, use the Prague precompiles and the IR pipeline.
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = true
# Local chain only. No RPC endpoints are configured on purpose. Under a fork URL forge still reports this chain ID to
# the code it runs, so the deploy script asks the RPC for the real one.
chain_id = 31337
fs_permissions = [
    { access = "read", path = "./out" },
    { access = "read", path = "./lib/holdback/contracts/deployments" },
    { access = "read-write", path = "./deployments" },
]

[fuzz]
runs = 256

[fmt]
line_length = 120

# The recorded deep campaigns (docs/audit/readiness.md): `FOUNDRY_PROFILE=deep forge test --match-path 'test/invariant/*'`.
# Suites with in-file `deep.` settings use those instead (the in-file `default.` settings are CI's).
[profile.deep.invariant]
runs = 1000
depth = 200

[profile.deep.fuzz]
runs = 20000
